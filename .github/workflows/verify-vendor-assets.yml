name: Verify vendored assets

on:
  pull_request:
    paths:
      - Makefile
      - package.json
      - package-lock.json
      - static/vendor/**
  push:
    branches: [main]
    paths:
      - Makefile
      - package.json
      - package-lock.json
      - static/vendor/**

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: make assets
      - run: |
          git diff --exit-code -- static/vendor/ || {
            echo "::error::static/vendor/ is out of sync with package.json/package-lock.json — run 'make assets' locally and commit the result."
            exit 1
          }
