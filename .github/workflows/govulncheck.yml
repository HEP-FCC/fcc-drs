name: govulncheck

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Catch newly disclosed CVEs even when nothing in the repo changes.
    - cron: '17 4 * * 1'

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...
      - name: govulncheck (prod tags)
        run: govulncheck -tags prod ./...
