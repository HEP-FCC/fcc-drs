apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fcc-drs-test

resources:
  - ../../base
  - route.yaml

# newTag is a placeholder — deploy-staging in .gitlab-ci.yml overwrites it with
# ${CI_COMMIT_BRANCH}-${CI_COMMIT_SHORT_SHA} via sed before applying.
images:
  - name: fcc-drs
    newName: gitlab-registry.cern.ch/hep-fcc/fcc-drs
    newTag: latest
